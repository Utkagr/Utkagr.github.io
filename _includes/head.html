<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
{% seo %}
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}" />
<script>
  (function () {
    var d = document.documentElement;
    try {
      var t = localStorage.getItem('ua-theme'), b = localStorage.getItem('ua-bg');
      if (t) d.setAttribute('data-theme', t);
      if (b) d.setAttribute('data-bg', b);
    } catch (e) {}
  }());
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{ '/css/site.css' | relative_url }}" />
